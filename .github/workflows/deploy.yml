# Deterministic production deploys: build the image on the VPS and roll the
# swarm service on every push to main. Dokploy stays as the panel/UI of
# record, but deploys no longer depend on its webhook delivery.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync source to VPS
        run: |
          rsync -a --exclude node_modules --exclude .git --exclude dist \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/watchora-build/

      - name: Build image on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd ~/watchora-build && docker build -t orazen-watchora-c1gnyj:latest . 2>&1 | tail -2'

      - name: Roll swarm service
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'docker service update --force --detach mjna70kuhhz7 && sleep 45 && docker ps --filter name=orazen-watchora --format "{{.Status}}" | head -1'

      - name: Verify health
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://watchora.ramagiritharun.in/api/healthz || true)
            if [ "$CODE" = "200" ]; then echo "healthz 200 — deploy verified"; exit 0; fi
            sleep 20
          done
          echo "healthz did not return 200 in time"; exit 1
